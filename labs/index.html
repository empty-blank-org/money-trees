<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Money Trees Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#09100d;--panel:#101914;--ink:#e8e1d2;--muted:#999487;--line:#2e3a32;--gold:#d3b46f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#233226 0,transparent 38%),var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:38px 24px 70px}header{display:flex;justify-content:space-between;gap:30px;align-items:flex-start;margin-bottom:32px}h1{font:500 clamp(38px,6vw,72px)/.95 Georgia,serif;margin:8px 0 14px}.eyebrow,.category{font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}.dek{max-width:690px;color:#b8b1a3;font-size:16px}.home{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 11px;white-space:nowrap}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.controls button{border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:#111a16;color:#bdb7a9;cursor:pointer}.controls button.active{border-color:#a98c4f;background:#3a301c;color:#fff0c9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{display:flex;min-height:205px;flex-direction:column;padding:19px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,rgba(24,36,29,.94),rgba(10,16,13,.9));color:inherit;text-decoration:none;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#a98c4f}.card h2{font:500 24px/1.1 Georgia,serif;margin:18px 0 8px}.card p{color:var(--muted);margin:0 0 17px}.meta{margin-top:auto;color:#777f76;font:11px ui-monospace,monospace}.empty{color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding-inline:14px}header{display:block}.home{display:inline-block;margin-top:12px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Money Trees · experimental archive</div><h1>The lab</h1><p class="dek">Working studies, alternate views, and discarded branches from the path to the Arboretum. Each experiment is frozen and self-contained, so production can evolve without erasing the design history.</p></div><a class="home" href="../">← Main Arboretum</a></header>
  <nav class="controls" id="filters" aria-label="Filter experiments"></nav>
  <section class="grid" id="grid"><p class="empty">Loading experiments…</p></section>
</main>
<script>
const labels={all:'All experiments',main:'Main-view variants',concept:'Product concepts',research:'Research tools',play:'Play'};
let experiments=[],active='all';
function render(){document.getElementById('filters').innerHTML=Object.entries(labels).map(([id,label])=>`<button data-id="${id}" class="${active===id?'active':''}">${label}</button>`).join('');const shown=experiments.filter(x=>active==='all'||x.category===active);document.getElementById('grid').innerHTML=shown.map(x=>`<a class="card" href="experiments/${x.slug}/"><span class="category">${labels[x.category]}</span><h2>${x.title}</h2><p>${x.description}</p><span class="meta">${x.status} · ${x.slug}</span></a>`).join('')||'<p class="empty">No experiments in this group.</p>'}
document.getElementById('filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;active=b.dataset.id;render()};
fetch('experiments.json').then(r=>r.json()).then(d=>{experiments=d.experiments;render()}).catch(e=>{document.getElementById('grid').innerHTML=`<p class="empty">Could not load the catalog: ${e.message}</p>`});
</script></body></html>
