<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wood Palette Study — Money Trees</title>
  <style>
    :root{color-scheme:dark;--bg:#080d0a;--panel:#111812;--ink:#eee8da;--muted:#a49d8e;--line:rgba(229,216,188,.15);--gold:#d5ad61}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(circle at 50% -15%,#263225 0,transparent 42%),var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:26px 24px 60px}header{display:flex;justify-content:space-between;gap:28px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--gold);font:11px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}h1{margin:6px 0 7px;font:500 clamp(30px,4vw,52px)/1 Georgia,serif;letter-spacing:-.025em}.dek{max-width:780px;margin:0;color:#b8b0a0;font-size:15px}.back{color:#cbc3b2;text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:7px;padding:7px 10px}.controls{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:10px 12px;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:rgba(16,23,18,.88)}label{color:var(--muted);font-size:12px}select{margin-left:6px;color:var(--ink);background:#172019;border:1px solid #3c493d;border-radius:6px;padding:7px 9px;font:inherit}.readout{margin-left:auto;color:#c8b98e;font:12px ui-monospace,monospace}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-width:0;border:1px solid var(--line);border-radius:12px;background:rgba(15,21,17,.85);overflow:hidden}.card.overlay{border-color:rgba(213,173,97,.34)}.heading{padding:14px 15px 0}.heading h2{margin:0;font:500 21px Georgia,serif}.heading p{min-height:38px;margin:4px 0 0;color:var(--muted);font-size:12px}.scale{display:grid;grid-template-columns:1fr 1fr 1fr;height:8px;margin:11px 15px 0;border-radius:8px;overflow:hidden}.scale span:nth-child(1){background:var(--neg)}.scale span:nth-child(2){background:var(--mid)}.scale span:nth-child(3){background:var(--pos)}.scale-labels{display:flex;justify-content:space-between;margin:3px 15px 0;color:#777f74;font:9px ui-monospace,monospace;text-transform:uppercase}.canvas-wrap{position:relative}.card canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;background:radial-gradient(circle,rgba(44,48,35,.32),rgba(4,8,6,.08) 69%)}.card footer{display:flex;justify-content:space-between;gap:12px;padding:9px 14px 12px;border-top:1px solid var(--line);color:#918b7e;font-size:11px}.card footer b{color:#ded5c3}.tip{position:fixed;z-index:10;pointer-events:none;opacity:0;padding:8px 10px;border:1px solid #555d51;border-radius:7px;background:rgba(5,8,6,.95);color:#d9d2c4;font-size:12px}.tip b{color:white}.note{grid-column:span 2;display:grid;place-items:center;min-height:140px;padding:28px;border:1px dashed rgba(229,216,188,.14);border-radius:12px;color:#958f82;text-align:center}.note strong{display:block;color:#d8c9a9;font:500 20px Georgia,serif;margin-bottom:6px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.note{grid-column:span 1}}@media(max-width:650px){main{padding-inline:12px}header{display:block}.back{display:inline-block;margin-top:14px}.grid{grid-template-columns:1fr}.readout{width:100%;margin-left:0}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Prototype 17 · controlled palette comparison</div><h1>The same history, grown in five woods</h1><p class="dek">Every specimen preserves ring width, volatility texture, annual boundaries, and drawdown scars. Only the return palette changes. Hover any ring to compare the same year across all five treatments.</p></div><a class="back" href="../../">← all prototypes</a></header>
  <div class="controls"><label>specimen <select id="tree"></select></label><span class="readout" id="readout"></span></div>
  <section class="grid" id="grid"></section>
  <div class="tip" id="tip"></div>
</main>
<script src="shared/renderer.js"></script>
<script>
const STUDIES=[
  {id:'market',name:'Market signal',desc:'The current muted red–tan–green treatment.',colors:['#ca5c66','#ad9e7c','#58a991']},
  {id:'natural',name:'Natural wood',desc:'Walnut losses, amber heartwood, and pale sapwood gains.',colors:['#533726','#a27748','#e1b86f']},
  {id:'botanical',name:'Subtle botanical',desc:'Bark brown moves through ochre into a restrained olive.',colors:['#6a412f','#9e804f','#7e914c']},
  {id:'wood',name:'Single wood spectrum',desc:'Direction is carried mostly by lightness and warmth.',colors:['#4c392b','#977148','#e0be85']},
  {id:'overlay',name:'Wood + inspection overlay',desc:'Natural rings at rest; market color appears only on hover.',colors:['#5c4634','#99764f','#d3b17b']}
];
const grid=document.getElementById('grid'),treeEl=document.getElementById('tree'),tip=document.getElementById('tip');let trees=[],tree,hoverYear=null,raf=0;
function pct(x){return `${x>=0?'+':''}${(x*100).toFixed(1)}%`}
function render(){const m=LivingTrees.metrics(tree);document.getElementById('readout').textContent=`${tree.id.toUpperCase()} · ${tree.first_year}–${tree.last_year} · ${m.years} rings · ${pct(m.cagr)} CAGR`;grid.innerHTML=STUDIES.map(s=>`<article class="card ${s.id==='overlay'?'overlay':''}" data-palette="${s.id}"><div class="heading"><h2>${s.name}</h2><p>${s.desc}</p></div><div class="scale" style="--neg:${s.colors[0]};--mid:${s.colors[1]};--pos:${s.colors[2]}"><span></span><span></span><span></span></div><div class="scale-labels"><span>strong loss</span><span>near zero</span><span>strong gain</span></div><div class="canvas-wrap"><canvas data-palette="${s.id}"></canvas></div><footer><span>width = annual growth</span><b>${s.id==='overlay'?'hover to decode':'color = return direction'}</b></footer></article>`).join('')+`<aside class="note"><div><strong>What should win?</strong>The treatment that still reveals direction at a glance while making the collection feel like tree specimens rather than a financial heatmap.</div></aside>`;paint()}
function paint(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>document.querySelectorAll('canvas').forEach(cv=>{const s=cv.clientWidth,dpr=Math.min(devicePixelRatio||1,1.7);cv.width=Math.round(s*dpr);cv.height=Math.round(s*dpr);cv._size=s;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,s,s);cv._geo=LivingTrees.drawDetailedRings(g,tree,s/2,s/2,s*.425,9999,{palette:cv.dataset.palette,years:true,fibers:true,highlightYear:hoverYear})}))}
function yearAt(cv,e){const r=cv.getBoundingClientRect();return LivingTrees.detailedRingAt(cv._geo,cv._size/2,cv._size/2,e.clientX-r.left,e.clientY-r.top)?.year||null}
grid.onmousemove=e=>{const cv=e.target.closest('canvas');if(!cv)return;const year=yearAt(cv,e);if(year!==hoverYear){hoverYear=year;paint()}if(!year){tip.style.opacity=0;return}const ring=tree.rings.find(r=>r.year===year);tip.innerHTML=`<b>${tree.id.toUpperCase()} · ${year}${ring.partial?' (partial)':''}</b><br>return ${pct(ring.ret)} · volatility ${(ring.vol*100).toFixed(1)}%<br>max drawdown ${(ring.max_dd*100).toFixed(1)}%`;tip.style.left=Math.min(innerWidth-260,e.clientX+14)+'px';tip.style.top=Math.max(8,e.clientY+14)+'px';tip.style.opacity=1};
grid.onmouseleave=()=>{hoverYear=null;tip.style.opacity=0;paint()};treeEl.onchange=()=>{tree=trees.find(t=>t.id===treeEl.value);hoverYear=null;render()};window.addEventListener('resize',paint);
LivingTrees.load().then(d=>{const preferred=['btc','spy','qqq','gld','tlt','eth'];trees=d.trees.filter(t=>t.featured).sort((a,b)=>{const ai=preferred.indexOf(a.id),bi=preferred.indexOf(b.id);return (ai<0?99:ai)-(bi<0?99:bi)||a.id.localeCompare(b.id)});treeEl.innerHTML=trees.map(t=>`<option value="${t.id}">${t.id.toUpperCase()} · ${LivingTrees.CLASS_NAMES[t.cls]}</option>`).join('');tree=trees.find(t=>t.id==='spy')||trees[0];treeEl.value=tree.id;render()}).catch(e=>{grid.innerHTML=`<p>Could not load the prototype: ${e.message}</p>`});
</script></body></html>
