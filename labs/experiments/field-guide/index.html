<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Field Guide — Money Trees</title>
  <link rel="stylesheet" href="shared/living.css">
  <style>
    .page{display:block}.modebar,.subbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 22px 14px}.modebar{position:sticky;top:0;z-index:5;padding:10px 12px;background:rgba(12,19,16,.96);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(14px)}.modebar button.active,.subbar button.active{background:#765d2c;border-color:#b89552}.modebar .status{margin-left:auto;color:#9c9688;font-size:12px}.subbar{margin-bottom:18px}.subbar select{color:#eee9dd;background:#0d1713;border:1px solid #34443a;border-radius:7px;padding:7px 9px}.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0 22px 36px}.entry{min-width:0;border:1px solid var(--line);border-radius:12px;background:rgba(13,20,17,.78);overflow:hidden;cursor:pointer;transition:.15s}.entry:hover,.entry:focus-within,.entry.selected{border-color:#b89552;transform:translateY(-2px)}.entry button{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit}.entry canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;background:radial-gradient(circle,rgba(38,49,39,.31),rgba(4,9,7,.12) 68%)}.copy{padding:12px 14px 14px;border-top:1px solid var(--line)}.name{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ticker{font:600 18px ui-monospace,Menlo,monospace}.family{font:10px ui-monospace,Menlo,monospace;text-transform:uppercase;color:#b5a16d}.observation{margin:10px 0 0;color:#c0baac;font-size:12px}.observation + .observation{margin-top:5px;color:#918c80}.kin{margin:0 22px 18px;padding:15px 16px;border:1px solid rgba(190,157,88,.45);border-radius:11px;background:rgba(49,40,22,.35)}.kin-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.kin h2{margin:0;font:500 20px Georgia,serif}.kin p{margin:3px 0 12px;color:#9f998b;font-size:12px}.relatives{display:flex;gap:8px;flex-wrap:wrap}.relative{display:flex;gap:7px;align-items:center}.relative b{font:12px ui-monospace,Menlo,monospace}.relative span{color:#989284;font-size:11px}.trail-summary{margin:0 22px 16px;padding:16px;border-left:3px solid #b89552;background:rgba(41,34,20,.36)}.trail-summary h2{margin:0 0 4px;font:500 23px Georgia,serif}.trail-summary p{margin:0;color:#aaa395}.trail-meta{margin-top:8px!important;font:11px ui-monospace,Menlo,monospace;color:#d6c28e!important}.event-mark{display:inline-block;margin-top:9px;padding:3px 6px;border-radius:4px;background:#342919;color:#e2c98f;font:10px ui-monospace,Menlo,monospace}.empty{padding:30px 22px;color:#8f897e}.method{margin:0 22px 34px;color:#777d74;font-size:11px}.hidden{display:none}@media(max-width:900px){.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){header{padding-inline:14px}.modebar,.subbar,.kin,.trail-summary,.method{margin-inline:10px}.guide-grid{grid-template-columns:1fr;padding-inline:10px}.modebar .status{width:100%;margin-left:0}}
  </style>
</head>
<body><main class="page">
  <header><div><div class="eyebrow">Prototype · interpretive layer</div><h1 id="headline">A field guide to financial trees</h1><p class="dek" id="dek">Computed observations turn each specimen into something a reader can understand before they learn the complete encoding.</p></div><a class="back" href="../../">← the lab</a></header>
  <nav class="modebar" id="modes" aria-label="Field guide mode"><button class="active" data-mode="guide">Field notes</button><button data-mode="families">Forest families</button><button data-mode="events">Event trails</button><span class="status" id="status"></span></nav>
  <div class="subbar hidden" id="family-controls" aria-label="Choose a forest family"></div>
  <div class="subbar hidden" id="event-controls"><label>disturbance <select id="event-select" aria-label="Market event"></select></label></div>
  <section class="kin hidden" id="kin"></section>
  <section class="trail-summary hidden" id="trail-summary"></section>
  <section class="guide-grid" id="grid"></section>
  <p class="method" id="method"></p>
</main>
<script src="shared/living.js"></script>
<script>
const grid=document.getElementById('grid'),statusEl=document.getElementById('status'),familyControls=document.getElementById('family-controls'),eventControls=document.getElementById('event-controls'),eventSelect=document.getElementById('event-select'),kin=document.getElementById('kin'),trailSummary=document.getElementById('trail-summary'),method=document.getElementById('method');
let trees=[],events=[],mode='guide',family='all',selected=null,raf=0,stats={};
const FAMILY_ORDER=['quiet','storm','old','scarred','young','mixed'];
const FAMILY_LABELS={quiet:'Quiet compounders',storm:'Storm growers',old:'Old growth',scarred:'Scarred survivors',young:'Young canopy',mixed:'Mixed stand'};
const FAMILY_COPY={quiet:'Positive growers in the forest’s calmest volatility third.',storm:'Top-third growth paired with top-third volatility.',old:'Histories spanning at least twelve years.',scarred:'Trees carrying at least three qualifying wounds or an open scar.',young:'Trees with no more than seven visible annual bands.',mixed:'Specimens whose histories resist a single dominant family trait.'};
function quantile(xs,q){const a=xs.slice().sort((a,b)=>a-b),p=(a.length-1)*q,i=Math.floor(p),f=p-i;return a[i]+((a[i+1]??a[i])-a[i])*f}
function setupStats(){stats={volLo:quantile(trees.map(t=>t.mean_vol),.33),volHi:quantile(trees.map(t=>t.mean_vol),.67),growthHi:quantile(trees.map(t=>t.cagr),.67)};const fields=['cagr','mean_vol','n_rings','positive','worst','scarRate'];for(const f of fields){const xs=trees.map(t=>features(t)[f]),mean=xs.reduce((a,b)=>a+b,0)/xs.length,sd=Math.sqrt(xs.reduce((a,b)=>a+(b-mean)**2,0)/xs.length)||1;stats[f]={mean,sd}}}
function metrics(t){return LivingTrees.metrics(t,9999)}
function features(t){const m=metrics(t);return {cagr:m.cagr,mean_vol:m.meanVol,n_rings:m.years,positive:m.positive,worst:Math.abs(m.worst),scarRate:m.scars.length/m.years}}
function familyOf(t){const m=metrics(t),open=(t.scars||[]).some(s=>s.r_year==null);if(m.meanVol<=stats.volLo&&m.cagr>0)return'quiet';if(m.cagr>=stats.growthHi&&m.meanVol>=stats.volHi)return'storm';if(m.years<=7)return'young';if(t.age_years>=12)return'old';if(m.scars.length>=3||open)return'scarred';return'mixed'}
function fmtPct(x,d=1){return`${x>=0?'+':''}${(x*100).toFixed(d)}%`}
function notes(t){const m=metrics(t),rings=m.rings.slice(),best=rings.reduce((a,b)=>b.ret>a.ret?b:a),worst=rings.reduce((a,b)=>b.ret<a.ret?b:a),open=m.scars.filter(s=>s.r_year==null),pos=Math.round(m.positive*100);let first=`${pos}% of its ${m.years} visible years were positive; ${best.year} was widest at ${fmtPct(best.ret)}.`;let second;if(open.length){const d=Math.min(...open.map(s=>s.depth));second=`Its deepest open wound is ${fmtPct(d)} and still reaches the bark.`}else if(m.scars.length){const last=m.scars[m.scars.length-1];second=`Its latest major wound bottomed in ${last.year}${last.r_year?` and closed in ${last.r_year}`:''}.`}else second=`No drawdown cleared its ${(t.scar_thr*100).toFixed(0)}% scar threshold.`;return[first,second,`Weakest annual band: ${worst.year} at ${fmtPct(worst.ret)}.`]}
function distance(a,b){const fa=features(a),fb=features(b),weights={cagr:1.25,mean_vol:1,n_rings:.8,positive:.8,worst:1,scarRate:.7};return Math.sqrt(Object.keys(weights).reduce((s,k)=>s+weights[k]*((fa[k]-fb[k])/stats[k].sd)**2,0))}
function relatives(t){return trees.filter(x=>x!==t).map(x=>({tree:x,d:distance(t,x)})).sort((a,b)=>a.d-b.d).slice(0,5)}
function eventScar(t,event){return(t.scars||[]).filter(s=>s.date>=event.start&&s.date<=event.end).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function affected(event){return trees.map(t=>({tree:t,scar:eventScar(t,event)})).filter(x=>x.scar).sort((a,b)=>a.scar.date.localeCompare(b.scar.date)||a.scar.depth-b.scar.depth)}
function card(t,extra=''){const n=notes(t),fam=familyOf(t);return`<article class="entry ${selected===t?'selected':''}" data-id="${t.id}"><button type="button" aria-label="Find trees similar to ${t.id.toUpperCase()}"><canvas data-id="${t.id}" ${extra}></canvas><div class="copy"><div class="name"><span class="ticker" style="color:${LivingTrees.CLASS_COLORS[t.cls]}">${t.id.toUpperCase()}</span><span class="family">${FAMILY_LABELS[fam]}</span></div><p class="observation">${n[0]}</p><p class="observation">${n[1]}</p></div></button></article>`}
function paint(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>document.querySelectorAll('.entry canvas').forEach(cv=>{const t=trees.find(x=>x.id===cv.dataset.id),s=cv.clientWidth,dpr=Math.min(devicePixelRatio||1,1.5);cv.style.height=s+'px';cv.width=Math.round(s*dpr);cv.height=Math.round(s*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,s,s);LivingTrees.drawDetailedRings(g,t,s/2,s/2,s*.41,9999,{highlightYear:cv.dataset.year?+cv.dataset.year:null})}))}
function renderKin(){if(!selected){kin.classList.add('hidden');return}const rs=relatives(selected),fam=familyOf(selected);kin.classList.remove('hidden');kin.innerHTML=`<div class="kin-head"><h2>Trees like ${selected.id.toUpperCase()}</h2><button id="clear-kin">clear</button></div><p>Nearest structural relatives across growth, volatility, age, consistency, worst drawdown, and scar frequency. Its broad family is ${FAMILY_LABELS[fam].toLowerCase()}.</p><div class="relatives">${rs.map((r,i)=>`<button class="relative" data-relative="${r.tree.id}"><b style="color:${LivingTrees.CLASS_COLORS[r.tree.cls]}">${r.tree.id.toUpperCase()}</b><span>${i+1}${familyOf(r.tree)===fam?' · same family':''}</span></button>`).join('')}</div>`;document.getElementById('clear-kin').onclick=()=>{selected=null;render()};kin.querySelector('.relatives').onclick=e=>{const b=e.target.closest('[data-relative]');if(!b)return;selected=trees.find(t=>t.id===b.dataset.relative);render()}}
function renderGuide(){document.getElementById('headline').textContent='A field guide to financial trees';document.getElementById('dek').textContent='Computed observations turn each specimen into something a reader can understand before learning the complete encoding.';statusEl.textContent=`${trees.length} annotated specimens`;grid.innerHTML=trees.map(t=>card(t)).join('');method.textContent='Every sentence is assembled from annual returns, realized volatility, and qualifying drawdown records already present in rings.json.'}
function renderFamilies(){document.getElementById('headline').textContent='The forest organizes itself into families';document.getElementById('dek').textContent='Relative thresholds reveal shared life histories that conventional asset classes miss.';const shown=family==='all'?trees:trees.filter(t=>familyOf(t)===family);statusEl.textContent=`${shown.length} specimens`;familyControls.innerHTML=[['all','All families'],...FAMILY_ORDER.map(f=>[f,FAMILY_LABELS[f]])].map(([id,label])=>`<button data-family="${id}" class="${family===id?'active':''}">${label}</button>`).join('');grid.innerHTML=shown.map(t=>card(t)).join('')||'<p class="empty">No specimens in this family.</p>';method.textContent=family==='all'?'Growth and volatility families use collection-relative thirds; age and wound families use the explicit rules shown when selected.':FAMILY_COPY[family]}
function renderEvents(){const event=events.find(e=>e.key===eventSelect.value)||events[0],items=affected(event);eventSelect.innerHTML=events.map(e=>`<option value="${e.key}" ${e===event?'selected':''}>${e.name}</option>`).join('');document.getElementById('headline').textContent=`${event.name} left ${items.length} visible wounds`;document.getElementById('dek').textContent='Follow one disturbance through every featured tree whose qualifying scar bottomed inside the event window.';statusEl.textContent=`${items.length} of ${trees.length} specimens`;const recovered=items.filter(x=>x.scar.r_year!=null),stillOpen=items.length-recovered.length,medianDepth=items.length?quantile(items.map(x=>Math.abs(x.scar.depth)),.5):0;trailSummary.innerHTML=`<h2>${event.start} → ${event.end}</h2><p>Wounds are ordered by their actual trough dates, turning the collection into a cross-market event trail.</p><p class="trail-meta">median depth −${(medianDepth*100).toFixed(1)}% · ${recovered.length} recovered · ${stillOpen} still open</p>`;grid.innerHTML=items.map(({tree,scar})=>card(tree,`data-year="${scar.year}"` ).replace('</div></button></article>',`<span class="event-mark">${scar.date} · ${fmtPct(scar.depth)} · ${scar.r_year?`closed ${scar.r_year}`:'open'}</span></div></button></article>`)).join('')||'<p class="empty">No featured tree carries a qualifying scar whose trough falls inside this window.</p>';method.textContent='An event match requires the scar trough date—not merely a negative annual return—to fall within the named window.'}
function render(){familyControls.classList.toggle('hidden',mode!=='families');eventControls.classList.toggle('hidden',mode!=='events');trailSummary.classList.toggle('hidden',mode!=='events');if(mode==='guide')renderGuide();if(mode==='families')renderFamilies();if(mode==='events')renderEvents();renderKin();paint()}
document.getElementById('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()};familyControls.onclick=e=>{const b=e.target.closest('[data-family]');if(!b)return;family=b.dataset.family;render()};eventSelect.onchange=render;grid.onclick=e=>{const entry=e.target.closest('.entry');if(!entry)return;selected=trees.find(t=>t.id===entry.dataset.id);render()};window.addEventListener('resize',paint);
Promise.all([LivingTrees.load(),fetch('data/spans.json').then(r=>r.json())]).then(([data,spans])=>{trees=data.trees.filter(t=>t.featured);setupStats();events=spans.events.filter(e=>affected(e).length>=3);eventSelect.innerHTML=events.map(e=>`<option value="${e.key}">${e.name}</option>`).join('');render()}).catch(e=>{grid.innerHTML=`<p class="empty">Could not load the field guide: ${e.message}</p>`;console.error(e)});
</script></body></html>
