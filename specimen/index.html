<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full Specimen — Money Trees</title><link rel="stylesheet" href="../shared/living.css">
<style>
  html,body{height:100%;overflow:hidden}.page{height:100%;grid-template-rows:auto auto 1fr}header{padding:14px 22px 9px;align-items:center}h1{font-size:clamp(23px,3vw,35px)}.controls{margin:0 22px 9px}.controls select{color:#eee9dd;background:#0d1713;border:1px solid #34443a;border-radius:7px;padding:7px 9px}.viewer{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;padding:0 14px 14px}.art{position:relative;min-width:0;min-height:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:radial-gradient(circle,rgba(38,49,39,.28),rgba(4,9,7,.25) 68%);overflow:hidden}.art canvas{display:block;width:min(100%,calc(100vh - 174px));height:auto;aspect-ratio:1/1}.art .tooltip{position:fixed;z-index:20}.ledger{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:13px;background:rgba(11,18,15,.84);padding:15px}.ledger h2{margin:0 0 3px;font:500 22px Georgia,serif}.classline{font:11px ui-monospace,Menlo,monospace;text-transform:uppercase}.facts{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:17px 0;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#9e988b}.facts b{color:#eee9dd;text-align:right}.ledger h3{margin:16px 0 7px;font:500 15px Georgia,serif}.scar{padding:8px 0;border-top:1px solid rgba(228,218,190,.09);color:#aaa596;font-size:12px}.scar b{color:#ddd5c4}.empty{color:#847f74;font-style:italic}.grain-key{font-size:11px;color:#8e897d;margin-top:16px}.grain-key i{display:inline-block;width:30px;height:8px;margin-right:7px;background:repeating-linear-gradient(0deg,transparent 0 1px,rgba(230,220,190,.38) 1px 2px);vertical-align:middle}.backrow{display:flex;gap:13px;align-items:center}.backrow a{color:#c9c2ae;text-decoration:none}@media(max-width:800px){html,body{height:auto;overflow:auto}.page{height:auto}.viewer{grid-template-columns:1fr}.art{min-height:auto}.art canvas{width:min(100%,92vw)}.ledger{overflow:visible}header{align-items:flex-start}.controls{margin-inline:12px}.viewer{padding-inline:8px}}
</style></head><body><main class="page">
<header><div><div class="eyebrow">Full specimen · one true band per year</div><h1 id="title">Loading specimen…</h1></div><div class="backrow"><a id="back" href="../arboretum/">← collection</a><a href="../">gallery</a></div></header>
<div class="controls"><button id="prev">←</button><select id="ticker" aria-label="Asset ticker"></select><button id="next">→</button><span class="note">Hover any annual band to inspect it · arrow keys change specimen</span></div>
<section class="viewer"><div class="art" id="art"><canvas id="canvas"></canvas><div class="tooltip" id="tip"></div></div><aside class="ledger"><h2 id="name"></h2><div class="classline" id="classline"></div><div class="facts" id="facts"></div><h3>Scar ledger</h3><div id="scars"></div><p class="grain-key"><i></i>Four internal contours per annual band. Their amplitude is proportional to that year’s realized volatility.</p></aside></section>
</main><script src="../shared/living.js"></script><script>
const cv=document.getElementById('canvas'),art=document.getElementById('art'),tickerEl=document.getElementById('ticker'),tip=document.getElementById('tip');let data,trees=[],tree,raf=0,hoverYear=null,geo=null,canvasSize=0;
const params=new URLSearchParams(location.search),origin=params.get('from')==='wall'?'../specimen-wall/':'../arboretum/';document.getElementById('back').href=origin;
function pct(x){return (x*100).toFixed(1)+'%'}function signed(x){return (x>=0?'+':'')+pct(x)}
function setUrl(){const u=new URL(location.href);u.searchParams.set('id',tree.id);u.searchParams.set('from',params.get('from')||'arboretum');history.replaceState(null,'',u)}
function paint(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const available=Math.min(art.clientWidth,art.clientHeight||art.clientWidth),s=Math.max(240,Math.floor(available)),dpr=Math.min(devicePixelRatio||1,2);canvasSize=s;cv.style.width=s+'px';cv.style.height=s+'px';cv.width=Math.round(s*dpr);cv.height=Math.round(s*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,s,s);geo=LivingTrees.drawDetailedRings(g,tree,s/2,s/2,s*.445,9999,{years:true,highlightYear:hoverYear})})}
function update(){const m=LivingTrees.metrics(tree,9999);if(!m)return;document.title=tree.id.toUpperCase()+' Full Specimen — Money Trees';document.getElementById('title').textContent=`${tree.id.toUpperCase()} carries ${m.years} visible annual rings`;document.getElementById('name').textContent=tree.id.toUpperCase();document.getElementById('classline').textContent=`${LivingTrees.CLASS_NAMES[tree.cls]} · ${tree.first_year}–${tree.last_year}`;document.getElementById('classline').style.color=LivingTrees.CLASS_COLORS[tree.cls];document.getElementById('facts').innerHTML=`<span>visible rings</span><b>${m.years}</b><span>annualized growth</span><b>${signed(m.cagr)}</b><span>positive years</span><b>${Math.round(m.positive*100)}%</b><span>mean volatility</span><b>${pct(m.meanVol)}</b><span>worst drawdown</span><b>${pct(m.worst)}</b><span>accumulated growth</span><b>${signed(Math.exp(m.sumLg)-1)}</b>`;document.getElementById('scars').innerHTML=m.scars.length?m.scars.slice().reverse().map(s=>`<div class="scar"><b>${s.date||s.year}</b> · ${pct(s.depth)} drawdown<br>${s.r_year?`recovered ${s.r_date||s.r_year}`:'still unrecovered in visible data'}</div>`).join(''):'<p class="empty">No qualifying major scars yet.</p>';tickerEl.value=tree.id;setUrl();hoverYear=null;paint()}
function select(id){tree=trees.find(t=>t.id===id)||trees[0];update()}
function move(dir){const i=trees.indexOf(tree);select(trees[(i+dir+trees.length)%trees.length].id)}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);tickerEl.onchange=e=>select(e.target.value);window.addEventListener('resize',paint);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')location.href=origin});
cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),b=LivingTrees.detailedRingAt(geo,canvasSize/2,canvasSize/2,e.clientX-r.left,e.clientY-r.top);if(!b){tip.style.opacity=0;if(hoverYear){hoverYear=null;paint()}return}if(hoverYear!==b.year){hoverYear=b.year;paint()}const ring=tree.rings.find(x=>x.year===b.year);tip.innerHTML=`<b>${tree.id.toUpperCase()} · ${b.year}${ring.partial?' (partial)':''}</b><br>return ${ring.ret>=0?'+':''}${pct(ring.ret)} · volatility ${pct(ring.vol)}<br>max drawdown ${pct(ring.max_dd)} · trough ${ring.scar_date||'—'}`;tip.style.left=Math.min(innerWidth-280,e.clientX+15)+'px';tip.style.top=Math.max(8,e.clientY+15)+'px';tip.style.opacity=1};cv.onmouseleave=()=>{tip.style.opacity=0;hoverYear=null;paint()};
LivingTrees.load().then(d=>{data=d;trees=d.trees.filter(t=>t.featured);tickerEl.innerHTML=trees.map(t=>`<option value="${t.id}">${t.id.toUpperCase()} · ${LivingTrees.CLASS_NAMES[t.cls]}</option>`).join('');select((params.get('id')||'btc').toLowerCase())}).catch(console.error);
</script></body></html>
