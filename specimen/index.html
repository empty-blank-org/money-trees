<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Full Specimen — Money Trees</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../app/specimen.css">
</head>
<body>
<main class="page">
  <header>
    <div><div class="eyebrow">Full specimen · one true band per year</div><h1 id="title">Loading specimen…</h1></div>
    <div class="backrow"><a id="back" href="../">← collection</a><a href="../labs/">lab</a></div>
  </header>
  <div class="controls"><button id="prev">←</button><select id="ticker" aria-label="Asset ticker"></select><button id="next">→</button><span class="note">Hover any annual band to inspect it · arrow keys change specimen</span></div>
  <section class="viewer">
    <div class="art" id="art"><canvas id="canvas"></canvas><div class="tooltip" id="tip"></div></div>
    <aside class="ledger"><h2 id="name"></h2><div class="classline" id="classline"></div><div class="facts" id="facts"></div><h3>Scar ledger</h3><div id="scars"></div><p class="grain-key"><i></i>Four internal contours per annual band. Their amplitude is proportional to that year’s realized volatility.</p></aside>
  </section>
</main>
<script src="../shared/tree-renderer.js"></script>
<script src="../app/specimen.js"></script>
</body>
</html>
