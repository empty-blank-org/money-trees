<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest Atlas — Money Trees</title><link rel="stylesheet" href="../shared/living.css">
<style>
  .stage{height:72vh;min-height:620px;overflow:auto}.stage>canvas{height:auto}.controls select{color:#eee9dd;background:#0d1713;border:1px solid #34443a;border-radius:7px;padding:7px 9px}
  .focus{display:none;position:fixed;z-index:8;right:24px;top:145px;width:270px;background:rgba(7,13,11,.96)}.focus canvas{width:236px;height:236px;margin:auto}.focus .close{float:right;padding:3px 7px}.metric{display:grid;grid-template-columns:1fr auto;gap:4px 12px;color:#aaa596}.metric b{color:#eee9dd}.event{color:#e2c88f;min-width:210px}
</style></head><body><main class="page">
<header><div><div class="eyebrow">Prototype 11 · candidate home</div><h1 id="title">The whole market, large enough to read</h1><p class="dek">A roomier forest with historical playback, meaningful sorting, adjustable density, and specimen inspection.</p></div><a class="back" href="../">← all prototypes</a></header>
<div class="controls">
  <button class="primary" id="play">▶ play</button><span class="year" id="year">2026</span><input id="timeline" type="range" min="2010" max="2026" value="2026">
  <span class="event" id="event">50 featured assets</span>
  <label>sort <select id="sort"><option value="featured">curated</option><option value="age">oldest first</option><option value="growth">highest CAGR</option><option value="drawdown">deepest scar</option><option value="calm">calmest first</option><option value="positive">most positive years</option></select></label>
  <label>trees/row <select id="density"><option>3</option><option selected>5</option><option>7</option></select></label>
</div>
<section class="stage" id="stage"><canvas id="canvas"></canvas><div class="tooltip" id="tip"></div></section>
<aside class="panel focus" id="focus"><button class="close" id="close">×</button><h2 id="focus-title"></h2><canvas id="focus-canvas"></canvas><div class="metric" id="metrics"></div></aside>
</main><script src="../shared/living.js"></script><script>
const cv=document.getElementById('canvas'),stage=document.getElementById('stage'),tip=document.getElementById('tip');
const slider=document.getElementById('timeline'),yearEl=document.getElementById('year'),eventEl=document.getElementById('event'),sortEl=document.getElementById('sort'),densityEl=document.getElementById('density');
let trees=[],year=2026,layout=[],playing=false,timer=null,selected=null;
const EVENTS={2018:'Crypto winter scars the clearing',2020:'COVID scars synchronize across classes',2022:'Stocks and bonds are wounded together',2026:'The current crypto wound remains open'};
function currentMetric(t){return LivingTrees.metrics(t,year)}
function sortedAlive(){let a=trees.filter(t=>t.first_year<=year);const f={featured:(a,b)=>a._i-b._i,age:(a,b)=>currentMetric(b).years-currentMetric(a).years,growth:(a,b)=>currentMetric(b).cagr-currentMetric(a).cagr,drawdown:(a,b)=>currentMetric(a).worst-currentMetric(b).worst,calm:(a,b)=>currentMetric(a).meanVol-currentMetric(b).meanVol,positive:(a,b)=>currentMetric(b).positive-currentMetric(a).positive}[sortEl.value];return a.sort(f)}
function resize(){const dpr=devicePixelRatio||1,w=stage.clientWidth,cols=+densityEl.value,rows=Math.ceil(sortedAlive().length/cols),cell=cols===3?190:cols===5?145:116,h=Math.max(stage.clientHeight,44+rows*cell);cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);draw(g,w,h)}
function draw(g,w,h){g.clearRect(0,0,w,h);layout=[];const list=sortedAlive(),cols=+densityEl.value,cellW=w/cols,rows=Math.ceil(list.length/cols),cellH=(h-40)/Math.max(1,rows),R=Math.min(cellW*.34,cellH*.34,cols===3?76:cols===5?55:42);list.forEach((t,i)=>{const x=cellW*(i%cols+.5),y=22+cellH*(Math.floor(i/cols)+.43);LivingTrees.drawRings(g,t,x,y,R,year,t===selected?1:.96);LivingTrees.label(g,t.id.toUpperCase(),x,y+R+17,LivingTrees.CLASS_COLORS[t.cls]);layout.push({t,x,y,R})});g.fillStyle='rgba(222,216,201,.45)';g.textAlign='left';g.font='11px ui-monospace,Menlo,monospace';g.fillText(`${list.length} TREES · SORTED BY ${sortEl.options[sortEl.selectedIndex].text.toUpperCase()}`,14,h-12)}
function setYear(v){year=+v;slider.value=year;yearEl.textContent=year;const n=trees.filter(t=>t.first_year<=year).length;document.getElementById('title').textContent=`By ${year}, ${n} market trees are alive`;eventEl.textContent=EVENTS[year]||`${n} featured assets with visible history`;if(selected&&selected.first_year<=year)inspect(selected);resize()}
function inspect(t){selected=t;const m=currentMetric(t),last=m.rings[m.rings.length-1],p=document.getElementById('focus');p.style.display='block';document.getElementById('focus-title').textContent=t.id.toUpperCase()+' · '+LivingTrees.CLASS_NAMES[t.cls];document.getElementById('metrics').innerHTML=`<span>visible rings</span><b>${m.years}</b><span>annualized growth</span><b>${(m.cagr*100).toFixed(1)}%</b><span>positive years</span><b>${Math.round(m.positive*100)}%</b><span>mean volatility</span><b>${(m.meanVol*100).toFixed(1)}%</b><span>worst drawdown</span><b>${(m.worst*100).toFixed(1)}%</b><span>latest year</span><b>${(last.ret*100).toFixed(1)}%</b>`;const fc=document.getElementById('focus-canvas'),dpr=devicePixelRatio||1;fc.width=236*dpr;fc.height=236*dpr;const fg=fc.getContext('2d');fg.setTransform(dpr,0,0,dpr,0,0);fg.clearRect(0,0,236,236);LivingTrees.drawRings(fg,t,118,118,104,year);resize()}
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'❚❚ pause':'▶ play';clearInterval(timer);if(playing)timer=setInterval(()=>setYear(year>=2026?2010:year+1),720)};slider.oninput=e=>{playing=false;clearInterval(timer);document.getElementById('play').textContent='▶ play';setYear(e.target.value)};sortEl.onchange=resize;densityEl.onchange=resize;document.getElementById('close').onclick=()=>{selected=null;document.getElementById('focus').style.display='none';resize()};window.onresize=resize;
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=layout.find(p=>Math.hypot(x-p.x,y-p.y)<=p.R);if(hit)inspect(hit.t)};
cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=layout.find(p=>Math.hypot(x-p.x,y-p.y)<=p.R);if(!hit){tip.style.opacity=0;return}const m=currentMetric(hit.t);tip.innerHTML=`<b>${hit.t.id.toUpperCase()}</b><br>${m.years} rings · ${(m.cagr*100).toFixed(1)}% CAGR<br>click to inspect`;tip.style.left=Math.min(stage.clientWidth-245,x+12)+'px';tip.style.top=Math.max(8,y+12)+'px';tip.style.opacity=1};cv.onmouseleave=()=>tip.style.opacity=0;
LivingTrees.load().then(d=>{trees=d.trees.filter(t=>t.featured).map((t,i)=>Object.assign(t,{_i:i}));setYear(2026)}).catch(console.error);
</script></body></html>
