<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore financial histories as tree rings: one annual band per year, encoded by growth, volatility, and drawdown scars.">
  <title>Money Trees — Financial history in annual rings</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="app/arboretum.css">
</head>
<body>
<main class="page">
  <header>
    <div>
      <div class="eyebrow">Money Trees · financial dendrochronology</div>
      <h1 id="headline">Explore fifty financial specimens</h1>
      <p class="dek">Rank the collection, inspect individual annual bands, or cross-date the same year across every visible tree. Click any specimen for its full record.</p>
    </div>
    <a class="back" href="labs/">Open the lab →</a>
  </header>
  <div class="toolbar">
    <div class="lens-row" id="lenses">
      <span class="count">ranked lens</span>
      <button class="active" data-lens="curated">All specimens</button>
      <button data-lens="growth">Fast growers</button>
      <button data-lens="quiet">Quiet compounders</button>
      <button data-lens="age">Old growth</button>
      <button data-lens="drawdown">Deep scars</button>
      <button data-lens="positive">Most positive</button>
      <button data-lens="wounded">Still wounded</button>
    </div>
    <div class="filter-row">
      <label>class <select id="class"><option value="all">all classes</option><option value="crypto">crypto</option><option value="equity">equity</option><option value="bonds">bonds</option><option value="commodities">commodities</option><option value="fx">FX</option></select></label>
      <label>family <select id="family"><option value="all">all families</option><option value="quiet">quiet compounders</option><option value="storm">storm growers</option><option value="old">old growth</option><option value="scarred">scarred survivors</option><option value="young">young canopy</option><option value="mixed">mixed stand</option></select></label>
      <label>across <select id="cols"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></label>
      <input id="search" type="text" placeholder="find ticker" aria-label="Find ticker">
      <label>cross-date <select id="cross"><option value="">all rings</option></select></label>
      <span class="cross-note" id="status"></span>
    </div>
  </div>
  <section class="grid" id="grid"></section>
  <div class="tooltip" id="tip"></div>
</main>
<script src="shared/tree-renderer.js"></script>
<script src="app/tree-insights.js"></script>
<script src="app/arboretum.js"></script>
</body>
</html>
