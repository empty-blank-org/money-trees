<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore financial histories as tree rings: one annual band per year, encoded by growth, volatility, and drawdown scars.">
  <title>Money Trees — Financial history in annual rings</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="app/arboretum.css">
</head>
<body>
<main class="page">
  <header>
    <div>
      <div class="eyebrow">Money Trees · financial dendrochronology</div>
      <h1 id="headline">A living collection of financial histories</h1>
      <p class="dek" id="dek">Browse by family of tree, arrange by any metric, or cross-date the same year across every visible specimen. Click any tree for its full record.</p>
    </div>
    <a class="back" href="labs/">Open the lab →</a>
  </header>
  <div class="toolbar">
    <div class="family-row" id="families">
      <span class="row-label">family</span>
      <button class="active" data-family="all">All specimens</button>
      <button data-family="quiet">Quiet compounders</button>
      <button data-family="storm">Storm growers</button>
      <button data-family="old">Old growth</button>
      <button data-family="scarred">Scarred survivors</button>
      <button data-family="young">Young canopy</button>
      <button data-family="mixed">Mixed stand</button>
    </div>
    <div class="filter-row">
      <label>arrange <select id="sort"></select></label>
      <label>class <select id="class"><option value="all">all classes</option><option value="crypto">crypto</option><option value="equity">equity</option><option value="bonds">bonds</option><option value="commodities">commodities</option><option value="fx">FX</option></select></label>
      <input id="search" type="text" placeholder="find ticker" aria-label="Find ticker">
      <label>cross-date <select id="cross"><option value="">all rings</option></select></label>
      <div class="palette-toggle" id="palette" role="group" aria-label="Ring color encoding"><span>color</span><button class="active" data-palette="wood" aria-pressed="true">wood</button><button data-palette="market" aria-pressed="false">market</button></div>
      <div class="return-legend" id="legend" data-palette="wood" role="img" aria-label="Wood colors run from loss through near zero to gain"><div class="legend-scale"><i></i><i></i><i></i></div><div class="legend-labels"><span>loss</span><span>near 0</span><span>gain</span></div></div>
      <span class="cross-note" id="status"></span>
    </div>
  </div>
  <section class="grid" id="grid"></section>
  <div class="tooltip" id="tip"></div>
</main>
<script src="shared/tree-renderer.js"></script>
<script src="app/tree-insights.js"></script>
<script src="shared/collection.js"></script>
<script src="app/arboretum.js"></script>
</body>
</html>
