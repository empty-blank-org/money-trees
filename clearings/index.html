<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest Clearings — Money Trees</title><link rel="stylesheet" href="../shared/living.css">
<style>.stage{height:72vh;min-height:620px;overflow:auto}.stage>canvas{height:auto}.controls select{color:#eee9dd;background:#0d1713;border:1px solid #34443a;border-radius:7px;padding:7px 9px}.summary{color:#d8c38d;min-width:260px}</style></head><body><main class="page">
<header><div><div class="eyebrow">Prototype 12 · grouped exploration</div><h1 id="title">Asset classes form distinct clearings</h1><p class="dek">The same forest, reorganized into meaningful groups. Change the grouping grammar to expose age, temperament, or shared damage.</p></div><a class="back" href="../">← all prototypes</a></header>
<div class="controls">
  <label>group by <select id="group"><option value="class">asset class</option><option value="era">first visible year</option><option value="temperament">volatility temperament</option><option value="scars">2022 scar</option></select></label>
  <label>within each clearing <select id="sort"><option value="growth">highest growth</option><option value="age">oldest first</option><option value="scars">most scarred</option></select></label>
  <span class="year" id="year">2026</span><input id="timeline" type="range" min="2010" max="2026" value="2026"><span class="summary" id="summary"></span>
</div>
<section class="stage" id="stage"><canvas id="canvas"></canvas><div class="tooltip" id="tip"></div></section>
</main><script src="../shared/living.js"></script><script>
const cv=document.getElementById('canvas'),stage=document.getElementById('stage'),groupEl=document.getElementById('group'),sortEl=document.getElementById('sort'),slider=document.getElementById('timeline'),tip=document.getElementById('tip');
let trees=[],year=2026,layout=[];
function m(t){return LivingTrees.metrics(t,year)}
function groupFor(t){const x=m(t);if(groupEl.value==='class')return LivingTrees.CLASS_NAMES[t.cls];if(groupEl.value==='era')return t.first_year<=2015?'Established by 2015':t.first_year<=2019?'Entered 2016–19':'Entered 2020+';if(groupEl.value==='temperament')return x.meanVol<.15?'Calm · under 15% vol':x.meanVol<.35?'Restless · 15–35% vol':'Wild · over 35% vol';return x.scars.some(s=>s.year===2022)?'Carries a 2022 scar':'No qualifying 2022 scar'}
function grouped(){const out=new Map();trees.filter(t=>t.first_year<=year).forEach(t=>{const k=groupFor(t);if(!out.has(k))out.set(k,[]);out.get(k).push(t)});const cmp={growth:(a,b)=>m(b).cagr-m(a).cagr,age:(a,b)=>m(b).years-m(a).years,scars:(a,b)=>m(b).scars.length-m(a).scars.length}[sortEl.value];out.forEach(v=>v.sort(cmp));return [...out.entries()]}
function resize(){const groups=grouped(),w=stage.clientWidth,dpr=devicePixelRatio||1,cols=w<650?3:w<950?5:7,cellH=116,headerH=58;let h=20;groups.forEach(([,v])=>h+=headerH+Math.ceil(v.length/cols)*cellH);h=Math.max(h+30,stage.clientHeight);cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);draw(g,w,h,groups,cols,cellH,headerH)}
function draw(g,w,h,groups,cols,cellH,headerH){g.clearRect(0,0,w,h);layout=[];let top=18;const cellW=(w-32)/cols;groups.forEach(([name,list],gi)=>{const classKey=Object.keys(LivingTrees.CLASS_NAMES).find(k=>LivingTrees.CLASS_NAMES[k]===name),accent=classKey?LivingTrees.CLASS_COLORS[classKey]:'#e6b85c';g.fillStyle='rgba(218,210,190,.035)';g.fillRect(10,top,w-20,headerH+Math.ceil(list.length/cols)*cellH-8);g.fillStyle=accent;g.fillRect(10,top,3,headerH-14);g.fillStyle='#eee9dd';g.textAlign='left';g.font='500 20px Georgia,serif';g.fillText(name,25,top+23);g.fillStyle='rgba(222,216,201,.52)';g.font='11px ui-monospace,Menlo,monospace';g.fillText(`${list.length} TREES`,25,top+42);const start=top+headerH;list.forEach((t,i)=>{const x=16+cellW*(i%cols+.5),y=start+cellH*(Math.floor(i/cols)+.40),R=Math.min(39,cellW*.32);LivingTrees.drawRings(g,t,x,y,R,year);LivingTrees.label(g,t.id.toUpperCase(),x,y+R+15,LivingTrees.CLASS_COLORS[t.cls]);layout.push({t,x,y,R,group:name})});top+=headerH+Math.ceil(list.length/cols)*cellH})}
function updateCopy(){const groups=grouped(),largest=groups.slice().sort((a,b)=>b[1].length-a[1].length)[0];document.getElementById('title').textContent=`${largest?.[0]||'The forest'} is the largest clearing`;document.getElementById('summary').textContent=`${groups.length} clearings · ${trees.filter(t=>t.first_year<=year).length} visible trees`}
groupEl.onchange=()=>{updateCopy();resize()};sortEl.onchange=resize;slider.oninput=e=>{year=+e.target.value;document.getElementById('year').textContent=year;updateCopy();resize()};window.onresize=resize;
cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=layout.find(p=>Math.hypot(x-p.x,y-p.y)<=p.R);if(!hit){tip.style.opacity=0;return}const xM=m(hit.t);tip.innerHTML=`<b>${hit.t.id.toUpperCase()}</b> · ${hit.group}<br>${(xM.cagr*100).toFixed(1)}% CAGR · ${xM.scars.length} scars`;tip.style.left=Math.min(stage.clientWidth-245,x+12)+'px';tip.style.top=Math.max(8,y+12)+'px';tip.style.opacity=1};cv.onmouseleave=()=>tip.style.opacity=0;
LivingTrees.load().then(d=>{trees=d.trees.filter(t=>t.featured);updateCopy();resize()}).catch(console.error);
</script></body></html>
